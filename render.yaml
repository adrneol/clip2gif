services:
  # Backend only. The frontend is deployed to Vercel from frontend/
  # (see README). Do NOT re-add a Render static site here — it would
  # deploy a duplicate frontend.
  #
  # IMPORTANT: services created MANUALLY in the Render Dashboard do NOT
  # inherit changes to this file. If your service was created manually,
  # apply the Root Directory / Build Command / Start Command / Health Check
  # below by hand in Dashboard > clip2gif-backend > Settings, or create the
  # service via New > Blueprint so this file stays authoritative.
  - type: web
    name: clip2gif-backend
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev: NODE_ENV=production is set on this service, and plain
    # `npm install` would then skip devDependencies (typescript, @types/*),
    # breaking `npm run build` (tsc). Render provides PORT automatically.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false # Manual: set to the public HTTPS URL of the frontend Static Site.
      - key: TEMP_DIR
        value: /tmp/clip2gif
      - key: MAX_UPLOAD_MB
        value: 100
      - key: MAX_SOURCE_DURATION_SECONDS
        value: 600
      - key: MAX_CLIP_DURATION_SECONDS
        value: 120
      - key: MAX_GIF_OUTPUT_MB
        value: 50
      - key: MAX_ACTIVE_CONVERSIONS
        value: 1
      - key: MAX_QUEUED_JOBS
        value: 3
      - key: TEMP_FILE_TTL_MINUTES
        value: 30
      - key: JOB_TIMEOUT_SECONDS
        value: 900
      - key: CLEANUP_INTERVAL_MINUTES
        value: 5
      - key: DEFAULT_PRESET
        value: balanced
    healthCheckPath: /api/health
